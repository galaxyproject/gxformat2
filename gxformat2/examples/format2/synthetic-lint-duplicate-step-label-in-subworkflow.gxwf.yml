class: GalaxyWorkflow
doc: Two list-form steps of an inline subworkflow repeat a label, which Galaxy rejects on import.
inputs:
  reads: data
outputs:
  out:
    outputSource: nested/out
steps:
  nested:
    in:
      inner_reads: reads
    run:
      class: GalaxyWorkflow
      inputs:
        inner_reads: data
      outputs:
        out:
          outputSource: a/out_file1
      steps:
        - label: a
          tool_id: cat1
          in:
            input1: inner_reads
        - label: a
          tool_id: cat1
          in:
            input1: inner_reads
