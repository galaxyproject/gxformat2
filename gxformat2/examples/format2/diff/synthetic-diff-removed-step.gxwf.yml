class: GalaxyWorkflow
label: diff base with trim removed and filter rewired to reads
inputs:
  reads:
    type: data
    format: fastqsanger
  min_quality:
    type: int
    default: 20
outputs:
  report:
    outputSource: qc/html_report
  filtered:
    outputSource: filter/out_file1
steps:
  qc:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy0
    tool_version: "0.74+galaxy0"
    in:
      input_file: reads
    out:
      - html_report
  filter:
    tool_id: Filter1
    tool_version: "1.1.0"
    in:
      input: reads
    out:
      - out_file1
    state:
      cond: "c1>0"
