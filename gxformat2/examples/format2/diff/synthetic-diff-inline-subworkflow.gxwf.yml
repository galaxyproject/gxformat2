class: GalaxyWorkflow
label: an inline subworkflow step with two chained inner steps
inputs:
  reads: data
outputs:
  out:
    outputSource: nested/out
steps:
  nested:
    in:
      inner_reads: reads
    run:
      class: GalaxyWorkflow
      inputs:
        inner_reads: data
      outputs:
        out:
          outputSource: second/out_file1
      steps:
        first:
          tool_id: cat1
          in:
            input1: inner_reads
        second:
          tool_id: cat1
          in:
            input1: first/out_file1
