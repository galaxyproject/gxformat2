class: GalaxyWorkflow
doc: |
  synthetic-loop-single-variable.gxwf.yml with the loop rule in full form plus a
  valueFrom, and outputMethod all_iterations.
inputs:
  start: int
outputs:
  count:
    outputSource: count/o1
steps:
  count:
    run:
      class: GalaxyWorkflow
      inputs:
        i1: int
      outputs:
        o1:
          outputSource: add_one/output
      steps:
        add_one:
          tool_id: add_one
          in:
            input: i1
    in:
      i1: start
    when: $(inputs.i1 < 10)
    loop:
      i1:
        outputSource: o1
        valueFrom: $(self + 1)
    outputMethod: all_iterations
