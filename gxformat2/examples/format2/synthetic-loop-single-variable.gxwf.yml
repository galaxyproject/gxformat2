class: GalaxyWorkflow
doc: |
  Count up to 10 with a workflow loop, as the CWL v1.3 conformance test
  loop_single_variable. The count step runs its subworkflow, which adds one to
  i1, as long as i1 < 10; after each iteration the subworkflow output o1 is fed
  back into the input i1.
inputs:
  start: int
outputs:
  count:
    outputSource: count/o1
steps:
  count:
    run:
      class: GalaxyWorkflow
      inputs:
        i1: int
      outputs:
        o1:
          outputSource: add_one/output
      steps:
        add_one:
          tool_id: add_one
          in:
            input: i1
    in:
      i1: start
    when: $(inputs.i1 < 10)
    loop:
      i1: o1
