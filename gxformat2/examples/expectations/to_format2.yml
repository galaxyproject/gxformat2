    - path: [inputs, 1, type_]
      value: directory_uri
    - path: [inputs, 1, optional]
      value: true
    - path: [inputs, 1, validators, 0, expression]
      value: "^s3://"
    - path: [inputs, 1, validators, 0, message]
      value: must be an S3 URI

