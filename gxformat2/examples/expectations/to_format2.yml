test_to_format2_via_native_text_input_validators:
  fixture: synthetic-text-input-validators.gxwf.yml
  operation: to_format2_via_native
  assertions:
    - path: [inputs, 0, validators, $length]
      value: 1
    - path: [inputs, 0, validators, 0, expression]
      value: "^moo"
    - path: [inputs, 0, validators, 0, message]
      value: must start with moo
    - path: [inputs, 1, validators, 0, expression]
      value: cow
    - path: [inputs, 1, validators, 0, negate]
      value: true

