# Bare-step refs are step refs, not workflow-input refs: dropping zebra
# cascades keep (in: zebra) and the output (outputSource: keep).
test_extract_draft_bare_step_ref_cascades:
  fixture: synthetic-draft-bare-step-ref.gxwf.yml
  operation: extract_draft_subset
  assertions:
    - path: [workflow, steps]
      value: {}
    - path: [dropped_steps, $length]
      value: 3
    - path: [dropped_steps, 0, path]
      value: [alpha]
    - path: [dropped_steps, 1, path]
      value: [zebra]
    - path: [dropped_steps, 2, path]
      value: [keep]
    - path: [dropped_steps, 2, reason, kind]
      value: cascade
    - path: [dropped_steps, 2, reason, depends_on]
      value: [[zebra]]
    - path: [dropped_outputs, $length]
      value: 1
    - path: [dropped_outputs, 0, label]
      value: out1
    - path: [dropped_outputs, 0, reason, depends_on]
      value: [[keep]]

test_extract_draft_rewrites_multi_source_and_default_inputs:
  fixture: synthetic-draft-extract-rewrites.gxwf.yml
  operation: extract_draft_subset
  assertions:
    - path: [dropped_steps, $length]
      value: 2
    - path: [dropped_steps, 0, path]
      value: [bad]
    # Single dead source with no default: the consumer cascades, no rewrite.
    - path: [dropped_steps, 1, path]
      value: [no_default]
    - path: [dropped_steps, 1, reason, depends_on]
      value: [[bad]]
    - path: [workflow, steps, no_default]
      value_absent: true
    # One survivor collapses the source list to a string.
    - path: [workflow, steps, string_carrier, in, joined_string]
      value: {source: b/out1}
    - path: [workflow, steps, list_carrier, in, joined_list]
      value: {source: [a/out1, b/out1]}
    # Dead single source with a default: step survives, source key removed.
    - path: [workflow, steps, with_default, in, defaulted]
      value: {default: fallback-value}
    # List-form `in:` keeps its carrier entry shape.
    - path: [workflow, steps, list_in, in]
      value: [{id: joined_entry, source: a/out1}]
    - path: [workflow, steps, all_survive, in, joined_alive]
      value: {source: [a/out1, b/out1]}
    - path: [workflow, steps, default_only, in, default_only_input]
      value: {default: v}
    - path: [rewritten_step_inputs, $length]
      value: 4
    - path: [rewritten_step_inputs, {in_key: joined_string}, path]
      value: [string_carrier]
    - path: [rewritten_step_inputs, {in_key: joined_string}, removed_refs]
      value: [bad/out1]
    - path: [rewritten_step_inputs, {in_key: joined_string}, surviving_refs]
      value: [b/out1]
    - path: [rewritten_step_inputs, {in_key: joined_list}, surviving_refs]
      value: [a/out1, b/out1]
    - path: [rewritten_step_inputs, {in_key: defaulted}, removed_refs]
      value: [bad/out1]
    - path: [rewritten_step_inputs, {in_key: defaulted}, surviving_refs]
      value: []
    - path: [rewritten_step_inputs, {in_key: joined_entry}, path]
      value: [list_in]
    - path: [rewritten_step_inputs, {in_key: joined_entry}, surviving_refs]
      value: [a/out1]
    # List-form workflow `outputs:` drops keep the list shape.
    - path: [workflow, outputs]
      value: [{id: keep, outputSource: a/out1}]
    - path: [dropped_outputs, $length]
      value: 1
    - path: [dropped_outputs, 0, label]
      value: drop_me

test_extract_draft_drop_order_direct_then_cascade_rounds:
  fixture: synthetic-draft-extract-drop-order.gxwf.yml
  operation: extract_draft_subset
  assertions:
    - path: [dropped_steps, $length]
      value: 4
    - path: [dropped_steps, 0, path]
      value: [alpha]
    - path: [dropped_steps, 1, path]
      value: [zulu]
    - path: [dropped_steps, 2, path]
      value: [mid]
    - path: [dropped_steps, 2, reason, depends_on]
      value: [[zulu]]
    - path: [dropped_steps, 3, path]
      value: [tail]
    - path: [dropped_steps, 3, reason, depends_on]
      value: [[mid]]
    # dropped_outputs sort alphabetically by label.
    - path: [dropped_outputs, $length]
      value: 3
    - path: [dropped_outputs, 0, label]
      value: aout
    - path: [dropped_outputs, 1, label]
      value: mout
    - path: [dropped_outputs, 2, label]
      value: zout
    # Root _plan_* and unconsumed inputs survive verbatim.
    - path: [workflow, _plan_context]
      value: root-level planning notes that survive extract
    - path: [workflow, inputs]
      value:
        reads: {type: data}
        orphan_extra: {type: data}

test_extract_draft_subworkflow_inner_shrink_port_loss_and_opaque_run:
  fixture: synthetic-draft-extract-subworkflow.gxwf.yml
  operation: extract_draft_subset
  assertions:
    - path: [dropped_steps, $length]
      value: 3
    # Outer subworkflow steps survive; inner drafts shrink.
    - path: [workflow, steps, keep_sub, run, class]
      value: GalaxyWorkflowDraft
    - path: [workflow, steps, keep_sub, run, steps]
      value:
        good:
          tool_id: cat1
          tool_version: "1.0.0"
          in: {input1: reads}
          out: [{id: out1}]
    - path: [workflow, steps, lost_sub, run, steps]
      value: {}
    # lost_sub no longer exposes `result`, so its consumer cascades.
    - path: [workflow, steps, downstream]
      value_absent: true
    - path: [dropped_steps, 0, path]
      value: [downstream]
    - path: [dropped_steps, 0, reason, kind]
      value: cascade
    - path: [dropped_steps, 0, reason, depends_on]
      value: [[lost_sub]]
    - path: [dropped_steps, 1, path]
      value: [keep_sub, bad]
    - path: [dropped_steps, 2, path]
      value: [lost_sub, inner_bad]
    # Inner output drops are hoisted with the outer step's path.
    - path: [dropped_outputs, $length]
      value: 2
    - path: [dropped_outputs, 0, path]
      value: [keep_sub]
    - path: [dropped_outputs, 0, label]
      value: pending
    - path: [dropped_outputs, 1, path]
      value: [lost_sub]
    - path: [dropped_outputs, 1, label]
      value: result
    - path: [dropped_outputs, 1, reason, kind]
      value: cascade
    # Top-level output survives: keep_sub's `result` still maps to a live inner output.
    - path: [workflow, outputs, result, outputSource]
      value: keep_sub/result
    # String-form run: is opaque; its declared out: ports count as live.
    - path: [workflow, steps, opaque_sub, run]
      value: https://example.org/some/workflow.ga
    - path: [workflow, steps, opaque_downstream, in, input1]
      value: opaque_sub/result

