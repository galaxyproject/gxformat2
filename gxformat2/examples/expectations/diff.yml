# diff_workflows compares a BEFORE workflow (fixture) with an AFTER one (fixture_after).
# Either side may be a draft. Result shape:
#   { before_is_draft, after_is_draft, has_changes,
#     inputs:  { added[id], removed[id], changed{id: {field: {before, after}}} },
#     outputs: { added[id], removed[id], changed{id: {before, after}} },
#     steps:   { added{key: summary}, removed{key: summary}, changed{key: change} },
#     unwired_inputs[id], warnings[str] }
# summary: { label, id, type, tool_id, tool_version, plan_fields{field: text},
#            upstream[node], downstream[step], workflow_outputs[id], connections[edge] }
#   id is the step's raw id as written, or null.
# change:  { label, fields{field: {before, after}}, state{path: {kind, before, after}},
#            in_defaults{port: {before, after}}, out_actions{port: {before, after}},
#            connections_in/connections_out/upstream/downstream: {added[], removed[]},
#            plan_fields_before{}, plan_fields_after{} }
# Object key order in the result is not part of the contract.
# Steps are reported under their step key (dict key; list form: label, else id, else index id).
# List-form steps on both sides with the same id (unique per side) match first, under the
# AFTER key, so a relabel is a fields.label change; the rest match on step key.
# A dict-form step's inner id is not its identity; changing it is no change.
# Inline subworkflows (run on both sides) are diffed too; their step keys, input and output
# ids and edge nodes are prefixed with the parent step key and "/" (e.g. nested/first) in
# the same maps. An added or removed subworkflow step lists only itself. unwired_inputs
# stays top-level. Linked runs compare by reference (fields.run).
# Edges render as "<step>/<port> -> <step>/<port>", or "<input> -> <step>/<port>".
# State paths join nested dict keys with "|"; lists are leaf values.
# An absent state leaf differs from one set to null, "" or [] (unlike out actions).
# out_actions cover only declared out fields; undeclared keys on an out entry are ignored.
# _plan_* fields never count as changes.
# Omitted nested input types (validator, record field, sample-sheet column) equal their defaults.

test_diff_identical_is_empty:
  fixture: synthetic-diff-base.gxwf.yml
  fixture_after: synthetic-diff-base.gxwf.yml
  operation: diff_workflows
  assertions:
    - path: [has_changes]
      value: false
    - path: [before_is_draft]
      value: false
    - path: [inputs, added, $length]
      value: 0
    - path: [inputs, removed, $length]
      value: 0
    - path: [inputs, changed, $length]
      value: 0
    - path: [outputs, added, $length]
      value: 0
    - path: [outputs, removed, $length]
      value: 0
    - path: [outputs, changed, $length]
      value: 0
    - path: [steps, added, $length]
      value: 0
    - path: [steps, removed, $length]
      value: 0
    - path: [steps, changed, $length]
      value: 0
    - path: [unwired_inputs, $length]
      value: 0
    - path: [warnings, $length]
