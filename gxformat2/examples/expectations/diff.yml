test_diff_draft_before_final_after:
  fixture: synthetic-diff-draft-before.gxwf.yml
  fixture_after: synthetic-diff-draft-after.gxwf.yml
  operation: diff_workflows
  assertions:
    - path: [before_is_draft]
      value: true
    - path: [after_is_draft]
      value: false
    - path: [steps, removed, $length]
      value: 1
    - path: [steps, removed, chr_filter, label]
      value: keep only requested chromosomes
    - path: [steps, removed, chr_filter, tool_id]
      value: TODO
    - path: [steps, removed, chr_filter, plan_fields, _plan_state]
      value_contains: contigs named by chr
    - path: [steps, removed, chr_filter, plan_fields, _plan_context]
      value_contains: SAMTOOLS_VIEW
    - path: [steps, removed, chr_filter, upstream]
      value: [chr, reads]
    - path: [steps, removed, chr_filter, downstream]
      value: [to_fastq]
    - path: [steps, changed, $length]
      value: 1
    - path: [steps, changed, to_fastq, fields, tool_id, before]
      value: TODO
    - path: [steps, changed, to_fastq, fields, tool_version, after]
      value: "1.15.1+galaxy2"
    - path: [steps, changed, to_fastq, plan_fields_before, _plan_context]
      value_contains: SAMTOOLS_FASTQ
    - path: [steps, changed, to_fastq, plan_fields_after, $length]
      value: 0
    - path: [steps, changed, to_fastq, upstream, removed]
      value: [chr_filter]
    - path: [steps, changed, to_fastq, upstream, added]
      value: [reads]
    - path: [steps, changed, to_fastq, state, output_fmt, kind]
      value: added
    - path: [outputs, changed, fastq, before]
      value: to_fastq/TODO_fastq
    - path: [outputs, changed, fastq, after]
      value: to_fastq/output
    - path: [unwired_inputs]
      value: [chr]

