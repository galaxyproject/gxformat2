# nextDraftStep picks the topologically-first step with remaining work.
# Tie-break is alphabetical by step label. Result is either
#   { draft: false }
# or
#   { draft: true, step: [path...], work: [prompt-shaped strings] }
# work[] order: tool_id → tool_version → in ports → out ports → _plan_state →
# _plan_context → _plan_in → _plan_out. (Locked in subplan D / draft-checks.)

test_next_draft_step_tool_step_returns_fastp_with_locked_work_order:
  fixture: synthetic-draft-tool-step.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step, 0]
      value: fastp
    - path: [work, 0]
      value_contains: "TODO[tool_id]"
    - path: [work, 1]
      value_contains: "TODO[tool_version]"

test_next_draft_step_chain_returns_topologically_first_drafty:
  fixture: synthetic-draft-chain.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step, $length]
      value: 1
    - path: [step, 0]
      value: b
    - path: [work, 0]
      value_contains: "TODO[tool_id]"

test_next_draft_step_subworkflow_descends_into_inner_draft:
  fixture: synthetic-draft-subworkflow-inner-draft.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step, 0]
      value: outer_subwf
    - path: [step, 1]
      value: inner_tool

test_next_draft_step_fully_concrete_returns_false:
  fixture: synthetic-draft-fully-concrete.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: false

test_next_draft_step_tiebreak_alphabetical:
  fixture: synthetic-draft-next-step-tiebreak.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step, 0]
      value: apple

test_next_draft_step_plan_subworkflow_picks_qc_with_plan_work:
  fixture: synthetic-draft-plan-subworkflow.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step, 0]
      value: qc
    - path: [work, 0]
      value_contains: "_plan_context"

test_next_draft_step_plan_top_level_returns_false:
  fixture: synthetic-draft-plan-top-level.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: false

test_next_draft_step_non_draft_returns_false:
  fixture: synthetic-basic.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: false

test_next_draft_step_tool_step_exact_work:
  fixture: synthetic-draft-tool-step.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [work, $length]
      value: 9
    - path: [work, 0]
      value: "TODO[tool_id]: pick a Galaxy Tool Shed wrapper for this step"
    - path: [work, 1]
      value: "TODO[tool_version]: pick the wrapper version"
    - path: [work, 2]
      value: "TODO[in.TODO_input]: assign the real wrapper input port name (semantic hint: 'input'; sourced from 'reads')"
    - path: [work, 3]
      value: "TODO[out.TODO_trimmed_paired]: assign the real wrapper output port name (semantic hint: 'trimmed_paired'; referenced by workflow output 'trimmed')"
    - path: [work, 4]
      value: "TODO[out.TODO_html_report]: assign the real wrapper output port name (semantic hint: 'html_report')"
    - path: [work, 5]
      value_matches: "^_plan_state: Adapter trimming on"
    - path: [work, 6]
      value_matches: "^_plan_context: Upstream process used fastp"
    - path: [work, 7]
      value_matches: "^_plan_in: TODO_input is the paired reads"
    - path: [work, 8]
      value_matches: "^_plan_out: TODO_trimmed_paired feeds"

test_next_draft_step_bare_todo_no_semantic_hint:
  fixture: synthetic-draft-todo-shapes.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [step]
      value: [a_bare]
    - path: [work]
      value:
        - "TODO[tool_id]: pick a Galaxy Tool Shed wrapper for this step"
        - "TODO[tool_version]: pick the wrapper version"
        - "TODO[in.TODO]: assign the real wrapper input port name (sourced from 'reads')"
        - "TODO[out.TODO]: assign the real wrapper output port name"

# alpha depends on zebra via bare ref `zebra` (= zebra/output); topology wins
# over the alphabetical tie-break.
test_next_draft_step_bare_step_ref_orders_dependency_first:
  fixture: synthetic-draft-bare-step-ref.gxwf.yml
  operation: next_draft_step
  assertions:
    - path: [draft]
      value: true
    - path: [step]
      value: [zebra]

