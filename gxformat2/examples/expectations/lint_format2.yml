      value: "Input default is of invalid type. Input mixed_list is [string]; its default must be a string or a list of strings."
    - path: [errors, 1]
      value: "Input default is of invalid type. Input number_default is [string]; its default must be a string or a list of strings."
    - path: [errors, 2]
      value: "Input default is of invalid type. Input bool_as_int is int; its default must be an integer."

