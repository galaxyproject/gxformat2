# Workflow loops: Format2 step `loop` / `outputMethod` (CWL v1.3) <-> native step `loop`.

# --- Schema validation ---

test_loop_single_variable_valid_format2:
  fixture: synthetic-loop-single-variable.gxwf.yml
  operation: validate_format2

test_loop_single_variable_valid_format2_strict:
  fixture: synthetic-loop-single-variable.gxwf.yml
  operation: validate_format2_strict

test_loop_cases_valid_format2:
  fixture: synthetic-loop-cases.gxwf.yml
  operation: validate_format2

test_loop_cases_valid_format2_strict:
  fixture: synthetic-loop-cases.gxwf.yml
  operation: validate_format2_strict

test_loop_cases_valid_native:
  fixture: converted-loop-cases.ga
  operation: validate_native

test_loop_cases_valid_native_strict:
  fixture: converted-loop-cases.ga
  operation: validate_native_strict

# --- Normalization ---

test_loop_shorthand_normalized:
  fixture: synthetic-loop-single-variable.gxwf.yml
  operation: normalized_format2
  assertions:
    - path: [steps, {label: count}, loop, $length]
      value: 1
    - path: [steps, {label: count}, loop, 0, id]
      value: i1
    - path: [steps, {label: count}, loop, 0, outputSource]
      value: o1
    - path: [steps, {label: count}, when]
      value: "$(inputs.i1 < 10)"

test_loop_full_form_normalized:
  fixture: synthetic-loop-cases.gxwf.yml
  operation: normalized_format2
  assertions:
    - path: [steps, {label: two_variables}, loop, 1, id]
      value: i2
    - path: [steps, {label: value_from_default}, loop, 0, default]
      value: 5
    - path: [steps, {label: value_from_default}, loop, 0, valueFrom]
      value: "$(self + 1)"
    - path: [steps, {label: multi_source}, loop, 0, outputSource]
      value: [small, large]
    - path: [steps, {label: multi_source}, loop, 0, pickValue]
      value: the_only_non_null
    - path: [steps, {label: all_iterations}, outputMethod]
      value: all_iterations
    - path: [steps, {label: nested}, run, steps, {label: inner}, loop, 0, outputSource]
      value: o1

test_loop_normalized_native:
  fixture: converted-loop-cases.ga
  operation: normalized_native
  assertions:
    - path: [steps, "4", loop, inputs, i1, link_merge]
      value: merge_nested
    - path: [steps, "2", loop, output_method]
      value: last_iteration

# --- Format2 -> native ---

test_loop_to_native_single_variable:
  fixture: synthetic-loop-single-variable.gxwf.yml
  operation: to_native
  assertions:
    - path: [steps, "1", type_]
      value: subworkflow
    - path: [steps, "1", when]
      value: "$(inputs.i1 < 10)"
    - path: [steps, "1", loop, inputs, i1, output_source]
      value: o1
    - path: [steps, "1", loop, output_method]
      value: null

test_loop_to_native_cases:
  fixture: synthetic-loop-cases.gxwf.yml
  operation: to_native
  assertions:
    - path: [steps, "2", loop, inputs, $length]
      value: 2
    - path: [steps, "2", loop, inputs, i2, output_source]
      value: o2
    - path: [steps, "3", loop, inputs, i1, default]
      value: 5
    - path: [steps, "3", loop, inputs, i1, value_from]
      value: "$(self + 1)"
    - path: [steps, "4", loop, inputs, i1, output_source]
      value: [small, large]
    - path: [steps, "4", loop, inputs, i1, pick_value]
      value: the_only_non_null
    - path: [steps, "5", loop, output_method]
      value: all_iterations
    - path: [steps, "6", loop, inputs, i2, output_source]
      value: null
    - path: [steps, "6", loop, inputs, i2, value_from]
      value: "$(inputs.i2 + 1)"
    - path: [steps, "6", subworkflow, steps, "2", loop, inputs, i1, output_source]
      value: o1
    - path: [steps, "6", subworkflow, steps, "2", when]
      value: "$(inputs.i1 < inputs.i2)"

test_loop_to_native_no_loop:
  fixture: synthetic-nested-subworkflow.gxwf.yml
  operation: to_native
  assertions:
    - path: [steps, "2", type_]
      value: subworkflow
    - path: [steps, "2", loop]
      value: null

# --- native -> Format2 ---

test_loop_to_format2_cases:
  fixture: converted-loop-cases.ga
  operation: to_format2
  assertions:
    - path: [steps, {label: two_variables}, loop, 0, id]
      value: i1
    - path: [steps, {label: two_variables}, loop, 0, outputSource]
      value: o1
    # Galaxy writes the default output_method; export leaves it out.
    - path: [steps, {label: two_variables}, outputMethod]
      value: null
    - path: [steps, {label: value_from_default}, loop, 0, default]
      value: 5
    - path: [steps, {label: value_from_default}, loop, 0, valueFrom]
      value: "$(self + 1)"
    - path: [steps, {label: multi_source}, loop, 0, outputSource]
      value: [small, large]
    - path: [steps, {label: multi_source}, loop, 0, linkMerge]
      value: merge_nested
    - path: [steps, {label: multi_source}, loop, 0, pickValue]
      value: first_non_null
    - path: [steps, {label: multi_source}, outputMethod]
      value: null
    - path: [steps, {label: all_iterations}, outputMethod]
      value: all_iterations
    - path: [steps, {label: nested}, loop, 0, valueFrom]
      value: "$(inputs.i2 + 1)"
    - path: [steps, {label: nested}, run, steps, {label: inner}, loop, 0, outputSource]
      value: o1
    - path: [steps, {label: nested}, run, steps, {label: inner}, when]
      value: "$(inputs.i1 < inputs.i2)"

test_loop_to_format2_via_native:
  fixture: synthetic-loop-cases.gxwf.yml
  operation: to_format2_via_native
  assertions:
    - path: [steps, {label: multi_source}, loop, 0, pickValue]
      value: the_only_non_null
    - path: [steps, {label: nested}, outputMethod]
      value: all_iterations
    - path: [steps, {label: nested}, run, steps, {label: inner}, loop, 0, id]
      value: i1
