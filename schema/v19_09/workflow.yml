saladVersion: v1.1
$base: "https://galaxyproject.org/gxformat2/v19_09#"

$namespaces:
  gxformat2: "https://galaxyproject.org/gxformat2/v19_09#"
  gxformat2common: "https://galaxyproject.org/gxformat2/gxformat2common#"
  cwl: "https://w3id.org/cwl/cwl#"
  sld: "https://w3id.org/cwl/salad#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  pydantic: "https://galaxyproject.org/gxformat2/pydantic#"

$graph:
- name: "WorkflowDoc"
  type: documentation
  doc:
    - |
      # Galaxy Workflow Format 2 Description

      The traditional Galaxy workflow description (.ga) is not meant to be concise and is neither readily human readable or human writable.
      Format 2 addresses all three of these limitations while also converging (where it makes sense without sacrificing these other goals)
      with the workflow description with that used by the Common Workflow Language.

      This standard is in active development and a moving target in many ways, but we will try to keep what is ingestible by Galaxy
      backward-compatible going forward.

- $import: "../common/metaschema/metaschema_base.yml"
- $import: "./Process.yml"  # trimmed down version of cwl's Process.yml
- $import: "../common/common.yml"

- name: GalaxyType
  type: enum
  extends: sld:PrimitiveType
  symbols:
    - integer
    - text
    - File
    - data
    - collection
    - color
    - directory_uri
  doc:
    - "Extends primitive types with the native Galaxy concepts such as datasets and collections."
    - "Normalized gxformat2 workflow input declaration spellings are ``data``, ``collection``, ``string``, ``int``, ``float``, ``boolean``, ``color``, and ``directory_uri``. Other spellings are accepted as compatibility aliases on import but normalized gxformat2 output emits the normalized spellings."
    - "data: one Galaxy dataset input. Native Galaxy ``data_input`` converts to this spelling."
    - "File: accepted alias for ``data``, but normalized gxformat2 output emits ``data``. Note: workflow **test job** YAML uses ``type: File`` to mean 'stage this file as test input data', which is a separate concept from workflow input declaration."
    - "collection: one Galaxy dataset collection input. Native Galaxy ``data_collection_input`` converts to this spelling."
    - "string: normalized gxformat2 spelling for native Galaxy text workflow parameters."
    - "text: accepted alias for ``string`` because native Galaxy parameter state and Galaxy tool XML terminology use ``text``."
    - "int: normalized gxformat2 spelling for native Galaxy integer workflow parameters."
    - "integer: accepted alias for ``int`` because native Galaxy parameter state and Galaxy tool XML terminology use ``integer``."
    - "color: native Galaxy color workflow parameter; the value is a color string such as ``#ff0000``."
    - "directory_uri: native Galaxy directory URI workflow parameter; the value is a URI string such as ``s3://bucket/path/``."


- name: WorkflowStepType
  type: enum
  symbols:
    - tool
    - subworkflow
    - pause
    - pick_value
  doc:
    - |
        Module types used by Galaxy steps. Galaxy's native format allows additional types such as data_input, data_input_collection, and parameter_type
        but these should be represented as ``inputs`` in Format2.
    - "tool: Run a tool."
    - "subworkflow: Run a subworkflow."
    - "pause: Pause computation on this branch of workflow until user allows it to continue."
    - "pick_value: Select the first non-null value from multiple inputs. Used to merge branches of conditional or optional workflow paths."

- name: BaseInputParameter
  type: record
  extends:
    - cwl:InputParameter
    - gxformat2common:HasStepPosition
  fields:
    - name: optional
      type:
      - boolean
      - "null"
      default: false
      doc: |
        Controls whether Galaxy allows invocation of the workflow without a
        user-supplied value for this input. If ``true``, the input may be omitted
        at invocation time. ``optional`` and ``default`` are independent: a
        required input (``optional: false``) may still declare a ``default``,
        and an optional input may have no ``default``. ``default`` supplies a
        value when the invocation input is missing or ``null``; ``optional``
        controls whether the missing case is even permitted.

- name: BaseDataParameter
  type: record
  extends: [BaseInputParameter]
  fields:
    - name: format
      doc: |
        Specify datatype extensions for valid input datasets.
      type:
        - "null"
        - type: array
          items: string

- name: WorkflowDataParameter
  type: record
  extends:
    - BaseDataParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A data input parameter for a Galaxy workflow. Represents one Galaxy dataset.
    Normalized gxformat2 output uses ``type: data``. ``type: File`` is accepted as
    an alias, but should not be confused with workflow test job syntax where
    ``type: File`` means stage a file as test input data.
  fields:
    - name: type
      type:
        - string
        - "null"
      default: data
      pydantic:type: 'Literal["data", "File"] | None'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Specify valid types of data that may be assigned to this parameter.

- name: WorkflowCollectionParameter
  type: record
  extends:
    - BaseDataParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A collection input parameter for a Galaxy workflow - represents a dataset collection.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["collection"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``collection``.
    - name: collection_type
      doc: |
        Collection type (defaults to `list` if `type` is `collection`). Nested
        collection types are separated with colons, e.g. `list:list:paired`.
      type:
        - "null"
        - string
      jsonldPredicate:
        _id: "gxformat2:collection_type"
        noLinkCheck: true
    - name: column_definitions
      doc: |
        Column schema for sample-sheet collection inputs. Only meaningful when
        `collection_type` begins with `sample_sheet` - cross-field validation is
        applied in the pydantic post-validator.
      type:
        - "null"
        - type: array
          items: gxformat2common:SampleSheetColumnDefinition
      jsonldPredicate: "gxformat2:column_definitions"
    - name: fields
      doc: |
        Field schema for `record` collection inputs. Only meaningful when
        `collection_type` contains `record` (e.g. `record`, `list:record`,
        `sample_sheet:record`).
      type:
        - "null"
        - type: array
          items: gxformat2common:RecordFieldDefinition
      jsonldPredicate:
        _id: "sld:fields"
        mapSubject: name
        mapPredicate: type

- name: MinMax
  type: record
  fields:
    - name: min
      type:
        - int
        - float
        - "null"
      jsonldPredicate:
        _id: "gxformat2:MinMax/min"
        noLinkCheck: true
      doc: |
        Minimum allowed value (inclusive).
    - name: max
      type:
        - int
        - float
        - "null"
      jsonldPredicate:
        _id: "gxformat2:MinMax/max"
        noLinkCheck: true
      doc: |
        Maximum allowed value (inclusive).

- name: WorkflowIntegerParameter
  type: record
  extends:
    - BaseInputParameter
    - MinMax
  docParent: "#GalaxyWorkflow"
  doc: |
    A scalar integer workflow parameter. Normalized gxformat2 output uses
    ``type: int``. ``type: integer`` is accepted for compatibility with native
    Galaxy parameter state and Galaxy tool XML terminology.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["integer", "int"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``integer`` or ``int``.

- name: WorkflowFloatParameter
  type: record
  extends:
    - BaseInputParameter
    - MinMax
  docParent: "#GalaxyWorkflow"
  doc: |
    A float input parameter for a Galaxy workflow.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["float"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``float``.

- name: WorkflowTextParameter
  type: record
  extends:
    - BaseInputParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A scalar text workflow parameter. Normalized gxformat2 output uses
    ``type: string``. ``type: text`` is accepted for compatibility with native
    Galaxy parameter state and Galaxy tool XML terminology.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["text", "string"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``text`` or ``string``.
    - name: restrictions
      type:
        - "null"
        - type: array
          items:
            - string
            - gxformat2common:WorkflowTextOption
      jsonldPredicate: "gxformat2common:restrictions"
      doc: |
        Closed set of permitted values. When present, Galaxy renders the
        runtime input as a select. Items may be plain strings or
        `{value, label}` records.
    - name: suggestions
      type:
        - "null"
        - type: array
          items:
            - string
            - gxformat2common:WorkflowTextOption
      jsonldPredicate: "gxformat2common:suggestions"
      doc: |
        Open suggestion list. Galaxy still treats the input as text but
        offers these as suggestions.
    - name: restrictOnConnections
      type: boolean?
      jsonldPredicate: "gxformat2:restrictOnConnections"
      doc: |
        Ask Galaxy to derive valid choices from connected tool or
        subworkflow select inputs at runtime. Falls back to free text when
        derivation fails.
    - name: validators
      type:
        - "null"
        - type: array
          items: gxformat2common:WorkflowTextValidator
      jsonldPredicate: "gxformat2common:validators"
      doc: |
        Validators applied to values supplied for this input.

- name: WorkflowBooleanParameter
  type: record
  extends:
    - BaseInputParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A boolean input parameter for a Galaxy workflow.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["boolean"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``boolean``.

- name: WorkflowColorParameter
  type: record
  extends:
    - BaseInputParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A color input parameter for a Galaxy workflow. The value is a color
    string such as ``#ff0000``.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["color"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``color``.

- name: WorkflowDirectoryUriParameter
  type: record
  extends:
    - BaseInputParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    A directory URI input parameter for a Galaxy workflow. The value is a
    URI string such as ``s3://bucket/path/``.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["directory_uri"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Must be ``directory_uri``.
    - name: validators
      type:
        - "null"
        - type: array
          items: gxformat2common:WorkflowTextValidator
      jsonldPredicate: "gxformat2common:validators"
      doc: |
        Validators applied to values supplied for this input.

- name: WorkflowInputParameter
  type: record
  extends:
    - BaseDataParameter
    - MinMax
  docParent: "#GalaxyWorkflow"
  doc: |
    An input parameter to a Galaxy workflow. This is the catch-all type used
    by the Schema Salad codegen. The pydantic layer uses a discriminated union
    of the specific parameter types instead.
  fields:
    - name: type
      type:
      - GalaxyType
      - "null"
      - type: array
        items:
          - GalaxyType
      default: data
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Specify valid types of data that may be assigned to this parameter.
    - name: collection_type
      doc: |
        Collection type (defaults to `list` if `type` is `collection`). Nested
        collection types are separated with colons, e.g. `list:list:paired`.
      type:
        - "null"
        - string
      jsonldPredicate:
        _id: "gxformat2:collection_type"
        noLinkCheck: true
    - name: column_definitions
      doc: |
        Column schema for sample-sheet collection inputs. Only meaningful when
        `collection_type` begins with `sample_sheet`.
      type:
        - "null"
        - type: array
          items: gxformat2common:SampleSheetColumnDefinition
      jsonldPredicate: "gxformat2:column_definitions"
    - name: fields
      doc: |
        Field schema for `record` collection inputs. Only meaningful when
        `collection_type` contains `record`.
      type:
        - "null"
        - type: array
          items: gxformat2common:RecordFieldDefinition
      jsonldPredicate:
        _id: "sld:fields"
        mapSubject: name
        mapPredicate: type
    - name: restrictions
      type:
        - "null"
        - type: array
          items:
            - string
            - gxformat2common:WorkflowTextOption
      jsonldPredicate: "gxformat2common:restrictions"
      doc: |
        Closed set of permitted values for text-typed inputs. See
        `WorkflowTextParameter.restrictions`.
    - name: suggestions
      type:
        - "null"
        - type: array
          items:
            - string
            - gxformat2common:WorkflowTextOption
      jsonldPredicate: "gxformat2common:suggestions"
      doc: |
        Open suggestion list for text-typed inputs.
    - name: restrictOnConnections
      type: boolean?
      jsonldPredicate: "gxformat2:restrictOnConnections"
      doc: |
        For text-typed inputs - derive runtime choices from connected
        tool/subworkflow select inputs.
    - name: validators
      type:
        - "null"
        - type: array
          items: gxformat2common:WorkflowTextValidator
      jsonldPredicate: "gxformat2common:validators"
      doc: |
        Validators for text-typed and ``directory_uri`` inputs. See
        `WorkflowTextParameter.validators`.

- name: WorkflowOutputParameter
  type: record
  extends: cwl:OutputParameter
  docParent: "#GalaxyWorkflow"
  doc: |
    Describe an output parameter of a workflow.  The parameter must be
    connected to one parameter defined in the workflow that
    will provide the value of the output parameter. It is legal to
    connect a WorkflowInputParameter to a WorkflowOutputParameter.
  fields:
    - name: outputSource
      doc: |
        Specifies workflow parameter that supply the value of to
        the output parameter.
      # Steps don't reference outputs in gxformat2 (yet anyway).
      # Can we just link the step if before the /
      #jsonldPredicate:
      #  "_id": "gxformat2:outputSource"
      #  "_type": "@id"
      #  refScope: 0
      type:
        - string?
    - name: type
      type: GalaxyType?
      default: data
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Specify valid types of data that may be assigned to this parameter.

- name: WorkflowStep
  type: record
  extends:
    - cwl:Identified
    - cwl:Labeled
    - sld:Documented
    - gxformat2common:HasStepPosition
    - gxformat2common:ReferencesTool
    - gxformat2common:HasStepErrors
    - gxformat2common:HasUUID
  docParent: "#GalaxyWorkflow"
  doc: |
    This represents a non-input step a Galaxy Workflow.

    # A note about `state` and `tool_state` fields.

    Only one or the other should be specified. These are two ways to represent the "state"
    of a tool at this workflow step. Both are essentially maps from parameter names to
    parameter values.

    `tool_state` is much more low-level and expects a flat dictionary with each value a JSON
    dump. Nested tool structures such as conditionals and repeats should have all their values
    in the JSON dumped string. In general `tool_state` may be present in workflows exported from
    Galaxy but shouldn't be written by humans.

    `state` can contained a typed map. Repeat values can be represented as YAML arrays. An alternative
    to representing `state` this way is defining inputs with default values.
  fields:
    - name: in
      type:  WorkflowStepInput[]?
      pydantic:type: "list[WorkflowStepInput] | dict[str, WorkflowStepInput | str | list[str]] | None"
      jsonldPredicate:
        _id: "gxformat2:in"
        mapSubject: id
        mapPredicate: source
      doc: |
        Defines the input parameters of the workflow step.  The process is ready to
        run when all required input parameters are associated with concrete
        values.  Input parameters include a schema for each parameter which is
        used to validate the input object.  It may also be used build a user
        interface for constructing the input object.
    - name: out
      type:
        - type: array
          items: [string, WorkflowStepOutput]
        - "null"
      pydantic:type: "list[WorkflowStepOutput | str] | dict[str, WorkflowStepOutput | str] | None"
      jsonldPredicate:
        _id: "gxformat2:out"
        mapSubject: id
        mapPredicate: source
      doc: |
        Defines the parameters representing the output of the process.  May be
        used to generate and/or validate the output object.

        This can also be called 'outputs' for legacy reasons - but the resulting
        workflow document is not a valid instance of this schema.
    - name: state
      type: Any?
      pydantic:type: "dict[str, Any] | None"
      doc: |
        Structured tool state.
      jsonldPredicate:
        _id: "gxformat2:state"
        noLinkCheck: true
    - name: tool_state
      type: Any?
      pydantic:type: "str | dict[str, Any] | None"
      jsonldPredicate:
        _id: "gxformat2:tool_state"
        noLinkCheck: true
      doc: |
        Unstructured tool state.
    - name: post_job_actions
      type: Any?
      pydantic:type: "dict[str, Any] | None"
      jsonldPredicate:
        _id: "gxformat2:post_job_actions"
        noLinkCheck: true
      doc: |
        Optional dict of post-job actions keyed by ``{ActionType}{OutputName}``
        compound strings.  Same shape as the native ``post_job_actions`` field;
        each value is a record with ``action_type``, ``output_name``,
        ``action_arguments``.  Use the ``out:`` shorthand (``rename:``,
        ``hide:``, ``change_datatype:``, etc.) for common actions; this
        explicit form covers actions without an ``out:`` shorthand
        (``ValidateOutputsAction``, etc.) and any case where the typed
        record is preferred.
    - name: type
      type: WorkflowStepType?
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      default: tool
      doc: |
        Workflow step module's type (defaults to 'tool').
    - name: run
      type: Any?
      pydantic:type: "GalaxyWorkflow | str | dict[str, Any] | None"
      jsonldPredicate:
        _id: "cwl:run"
        _type: "@id"
        subscope: run
      doc: |
        Specifies a subworkflow to run. May be an inline workflow definition,
        a URL string, or an @import reference dict.
    - name: runtime_inputs
      type:
        - "null"
        - type: array
          items: string
    - name: when
      type:
        - "null"
        - string  # TODO: cwl defines an enum for this, not sure how that works
      jsonldPredicate:
        _id: "gxformat2:when"
        noLinkCheck: true
      doc: |
        If defined, only run the step when the expression evaluates to
        `true`.  If `false` the step is skipped.  A skipped step
        produces a `null` on each output.

        On a step with a `loop`, `when` is required and is evaluated before
        every iteration, including the first, on the inputs of the iteration
        about to run: the loop stops as soon as it evaluates to `false`.  If it
        is `false` before the first iteration the step is skipped.

        Expression should be an ecma5.1 expression.
    - name: loop
      type: LoopInput[]?
      pydantic:type: "list[LoopInput] | dict[str, LoopInput | str | list[str]] | None"
      jsonldPredicate:
        _id: "gxformat2:loop"
        mapSubject: id
        mapPredicate: outputSource
      doc: |
        Run the subworkflow of this step repeatedly, as the `loop` of a
        `LoopWorkflowStep` in CWL v1.3 (a draft at the time of writing).  Only
        a step that runs a subworkflow may have a `loop`, and it must also
        have a `when`.

        The first iteration takes the step inputs given in `in`.  Each entry
        of `loop` names a step input (its `id`) and says where that input
        takes its value from in the next iteration; every other input keeps
        the value it had in the first iteration.  The shorthand
        `input_id: output_label` is the same as
        `input_id: {outputSource: output_label}`.

        Galaxy's support for loops is in beta and must be enabled on the
        Galaxy server.  Galaxy does not support a loop on a tool step, the
        `pickValue` method `all_non_null`, the `linkMerge` method
        `merge_flattened`, nor a list `outputSource` without `pickValue`.
        Galaxy applies further checks of its own when it saves the
        workflow.
    - name: outputMethod
      type: LoopOutputMethod?
      jsonldPredicate:
        _id: "gxformat2:outputMethod"
        _type: "@vocab"
      doc: |
        What the outputs of a step with a `loop` are: those of the last
        iteration (`last_iteration`, used when not specified) or a list of
        each output over all iterations (`all_iterations`).  Only valid on a
        step with a `loop`.

- name: Sink
  type: record
  abstract: true
  fields:
    - name: source
      doc: |
        Specifies one or more workflow parameters that will provide input to
        the underlying step parameter.
      jsonldPredicate:
        "_id": "cwl:source"
        "_type": "@id"
        refScope: 2
      type:
        - string?
        - string[]?

- type: record
  name: WorkflowStepInput
  extends: [cwl:Identified, Sink, cwl:Labeled]
  docParent: "#WorkflowStep"
  doc: |
    TODO:

  fields:
    - name: default
      type: ["null", Any]
      doc: |
        The default value for this parameter to use if either there is no
        `source` field, or the value produced by the `source` is `null`.  The
        default must be applied prior to scattering or evaluating `valueFrom`.
      jsonldPredicate:
        _id: "sld:default"
        noLinkCheck: true

- name: LoopOutputMethod
  type: enum
  docParent: "#WorkflowStep"
  symbols:
    - last_iteration
    - all_iterations
  doc:
    - "The outputs of a step with a ``loop``, as CWL v1.3 ``LoopOutputMethod``."
    - "last_iteration: each output is that output of the last iteration that ran. If no iteration ran, the outputs are those of a skipped step."
    - "all_iterations: each output is a list of that output in every iteration, in iteration order; the list is empty if no iteration ran. In Galaxy, a list collection whose element identifiers are the iteration numbers."

- name: PickValueMethod
  type: enum
  docParent: "#LoopInput"
  symbols:
    - first_non_null
    - the_only_non_null
    - all_non_null
  doc:
    - "How one value is picked from the values of several sources, as CWL v1.3 ``PickValueMethod``."
    - "first_non_null: the first value that is not null; fails if every value is null."
    - "the_only_non_null: the only value that is not null; fails if every value is null or more than one is not."
    - "all_non_null: the list of the values that are not null. Not supported by Galaxy."

- name: LinkMergeMethod
  type: enum
  docParent: "#LoopInput"
  symbols:
    - merge_nested
    - merge_flattened
  doc:
    - "How the values of several sources are merged into a list, as CWL v1.3 ``LinkMergeMethod``."
    - "merge_nested: a list with one element per source, the default."
    - "merge_flattened: the values of the sources concatenated into one list. Not supported by Galaxy."

- type: record
  name: LoopInput
  extends: [cwl:Identified]
  docParent: "#WorkflowStep"
  doc: |
    Where one input of a step with a `loop` takes its value from in the next
    iteration, as CWL v1.3 `LoopInput`.  The `id` is the id of the step input
    (in `in`), which is the label of a subworkflow input.

    The value is computed after each iteration, in this order: the value of
    `outputSource` (null without one); with a list `outputSource`, the value
    `pickValue` picks; `default` if that value is null or the output was
    skipped; then `valueFrom`.  At least one of `outputSource`, `default` and
    `valueFrom` is required.
  fields:
    - name: outputSource
      type:
        - string?
        - string[]?
      # One JSON-LD term per field name: reuse the implicit predicate of
      # WorkflowOutputParameter.outputSource, so that term is unchanged.
      jsonldPredicate: "https://galaxyproject.org/gxformat2/v19_09#WorkflowOutputParameter/outputSource"
      doc: |
        The label of the subworkflow output whose value of the iteration that
        just ran this input takes, or a list of two or more labels with a
        `pickValue`.  Labels name outputs of the subworkflow this step runs,
        not steps of the enclosing workflow.
    - name: linkMerge
      type: LinkMergeMethod?
      jsonldPredicate: "cwl:linkMerge"
      doc: |
        How the values of a list `outputSource` are merged before `pickValue`
        picks one; only `merge_nested` (the default) is supported by Galaxy.
    - name: pickValue
      type: PickValueMethod?
      jsonldPredicate: "cwl:pickValue"
      doc: |
        How one value is picked from the values of a list `outputSource`,
        which needs `first_non_null` or `the_only_non_null` in Galaxy.
    - name: default
      type: ["null", Any]
      doc: |
        The value used if there is no `outputSource`, or if its value is null
        or the output was skipped.  Applied before `valueFrom`.  Galaxy accepts
        a default only for a parameter input of the subworkflow.
      jsonldPredicate:
        _id: "sld:default"
        noLinkCheck: true
    - name: valueFrom
      type: string?
      jsonldPredicate: "cwl:valueFrom"
      doc: |
        An expression that computes the value for the next iteration.  `self`
        is the value computed so far and `inputs` the inputs of the iteration
        that just ran.

- type: record
  name: Report
  doc: |
    Definition of an invocation report for this workflow. Currently the only
    field is 'markdown'.
  fields:
    - name: markdown
      type: string
      doc: |
        Galaxy flavored Markdown to define an invocation report.

- type: record
  name: WorkflowStepOutput
  docParent: "#WorkflowStep"
  extends: cwl:Identified
  doc: |
    Associate an output parameter of the underlying process with a workflow
    parameter.  The workflow parameter (given in the `id` field) be may be used
    as a `source` to connect with input parameters of other workflow steps, or
    with an output parameter of the process.

    A unique identifier for this workflow output parameter.  This is
    the identifier to use in the `source` field of `WorkflowStepInput`
    to connect the output value to downstream parameters.
  fields:
    rename:
      type: string?
    hide:
      type: boolean?
    delete_intermediate_datasets:
      type: boolean?
    change_datatype:
      type: string?
    set_columns:
      type: Any?
      pydantic:type: "dict[str, Any] | None"
    add_tags:
      type:
        - "null"
        - type: array
          items: string
    remove_tags:
      type:
        - "null"
        - type: array
          items: string

# --- Comment type discriminators ---

# Comment type discriminators use string with pydantic:type Literal
# instead of enums to avoid JSON-LD predicate collisions with GalaxyType symbols.

# --- Comment base and types ---

- name: BaseComment
  type: record
  abstract: true
  doc: |
    Base fields shared by all comment types.
  fields:
    - name: position
      type: Any?
      pydantic:type: "list[float] | None"
      jsonldPredicate: "https://galaxyproject.org/gxformat2/gxformat2common#HasStepPosition/position"
      doc: |
        Position of the comment on the editor canvas as ``[x, y]`` coordinates.
    - name: size
      type: Any?
      pydantic:type: "list[float] | None"
      doc: |
        Size of the comment as ``[width, height]``.
    - name: color
      type: string?
      # Shares the GalaxyType symbol IRI to avoid a JSON-LD predicate collision.
      jsonldPredicate: "https://galaxyproject.org/gxformat2/v19_09#GalaxyType/color"
      doc: |
        Display color of the comment (e.g. ``"none"``, ``"blue"``).
    - name: label
      type: string?
      jsonldPredicate: "rdfs:label"
      doc: |
        Optional label for referencing this comment from frame ``contains_comments``
        fields or for use as a map key when comments are represented as a mapping.

- name: TextComment
  type: record
  extends: BaseComment
  doc: |
    A plain text annotation in the workflow editor.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["text"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Comment type (``text``).
    - name: text
      type: string?
      jsonldPredicate: "https://galaxyproject.org/gxformat2/v19_09#GalaxyType/text"
      doc: |
        The text content.
    - name: bold
      type: boolean?
      doc: |
        Whether the text is displayed in bold.
    - name: italic
      type: boolean?
      doc: |
        Whether the text is displayed in italic.
    - name: text_size
      type:
        - "null"
        - float
        - int
      doc: |
        Font size of the text.

- name: MarkdownComment
  type: record
  extends: BaseComment
  doc: |
    A Markdown-rendered annotation in the workflow editor.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["markdown"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Comment type (``markdown``).
    - name: text
      type: string?
      jsonldPredicate: "https://galaxyproject.org/gxformat2/v19_09#GalaxyType/text"
      doc: |
        Markdown content.

- name: FrameComment
  type: record
  extends: BaseComment
  doc: |
    A rectangular grouping box that visually contains steps and other comments.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["frame"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Comment type (``frame``).
    - name: title
      type: string?
      doc: |
        Title displayed on the frame header.
    - name: contains_steps
      type:
        - "null"
        - type: array
          items:
            - string
            - int
      jsonldPredicate:
        _id: "gxformat2:contains_steps"
        noLinkCheck: true
      doc: |
        Step labels or indices contained within this frame.
    - name: contains_comments
      type:
        - "null"
        - type: array
          items:
            - string
            - int
      jsonldPredicate:
        _id: "gxformat2:contains_comments"
        noLinkCheck: true
      doc: |
        Comment labels or indices contained within this frame.

- name: FreehandComment
  type: record
  extends: BaseComment
  doc: |
    A freehand drawn line on the editor canvas.
  fields:
    - name: type
      type: string
      pydantic:type: 'Literal["freehand"]'
      jsonldPredicate:
        "_id": "sld:type"
        "_type": "@vocab"
        refScope: 2
        typeDSL: True
      doc: |
        Comment type (``freehand``).
    - name: thickness
      type:
        - "null"
        - float
        - int
      doc: |
        Line thickness.
    - name: line
      type: Any?
      pydantic:type: "list[list[float]] | None"
      jsonldPredicate:
        _id: "gxformat2:line"
        noLinkCheck: true
      doc: |
        Array of ``[x, y]`` coordinate pairs defining the freehand line path.

- name: WorkflowComment
  type: union
  names:
    - TextComment
    - MarkdownComment
    - FrameComment
    - FreehandComment
  doc: A visual annotation in the workflow editor, discriminated by type.

- name: GalaxyWorkflow
  type: record
  extends:
    - cwl:Process
    - gxformat2common:HasUUID
  specialize:
    - specializeFrom: cwl:InputParameter
      specializeTo: WorkflowInputParameter
    - specializeFrom: cwl:OutputParameter
      specializeTo: WorkflowOutputParameter
  documentRoot: true
  doc: |
    A Galaxy workflow description. This record corresponds to the description of a workflow that should be executable
    on a Galaxy server that includes the contained tool definitions.

    The workflows API or the user interface of Galaxy instances that are of version 19.09 or newer should be able to
    import a document defining this record.

    ## A note about `label` field.

    This is the name of the workflow in the Galaxy user interface. This is the mechanism that
    users will primarily identify the workflow using. Legacy support - this may also be called 'name' and Galaxy will
    consume the workflow document fine and treat this attribute correctly - however in order to validate against this
    workflow definition schema the attribute should be called `label`.
  fields:
    # I can't find a way to override the documentation of label, even though I contextual.
    # - name: label
    #  type:
    #    - "null"
    #    - string
    #  jsonldPredicate: "rdfs:label"
    #  doc: {$include: ../common/workflow_label_description.txt}
    #  # Legacy support - this may also be called 'name' and Galaxy will consume the workflow fine and treat this
    #  # attribute correctly - however in order to validate against this schema the attribute should be called label.
    - name: class
      jsonldPredicate:
        "_id": "@type"
        "_type": "@vocab"
      type:
        type: enum
        name: GalaxyWorkflow_class
        symbols: [ gxformat2:GalaxyWorkflow ]
    - name: steps
      doc: {$include: ../common/steps_description.txt}
      type:
        - type: array
          items: "#WorkflowStep"
      pydantic:type: "list[WorkflowStep] | dict[str, WorkflowStep]"
      jsonldPredicate:
          mapSubject: id
    - name: report
      doc: Workflow invocation report template.
      type: Report?
    - name: tags
      type:
      - type: array
        items: string
      - "null"
      doc: |
        Tags for the workflow.
    - name: comments
      type: Any?
      pydantic:type: "list[TextComment | MarkdownComment | FrameComment | FreehandComment] | dict[str, TextComment | MarkdownComment | FrameComment | FreehandComment] | None"
      jsonldPredicate:
          mapSubject: label
      doc: |
        Visual annotations for the workflow editor canvas. Comments are non-functional
        and do not affect workflow execution. May be specified as a list or as a mapping
        keyed by label.
    - name: creator
      type: Any?
      pydantic:type: "list[CreatorPerson | CreatorOrganization] | None"
      doc: |
        Workflow creators. Can be schema.org Person (https://schema.org/Person)
        or Organization (https://schema.org/Organization) entities.
    - name: is_based_on
      type: Any?
      pydantic:type: "list[BasedOnWork] | None"
      jsonldPredicate:
        _id: "https://galaxyproject.org/gxformat2/v19_09#GalaxyWorkflow/is_based_on"
        noLinkCheck: true
      doc: |
        Upstream works this workflow was derived or adapted from
        (schema.org isBasedOn, https://schema.org/isBasedOn), e.g. an nf-core
        pipeline ported to Galaxy. Each entry has an optional schema.org
        ``class`` (default ``SoftwareSourceCode``), ``name``, ``alternateName``,
        ``description``, ``identifier``, ``image``, ``url``, ``version``,
        ``license`` (SPDX) and ``creator`` (a list of Person or Organization
        entities, as for the workflow-level ``creator``). Credit upstream
        authors here rather than in the workflow-level ``creator``.
    - name: license
      type: string?
      doc: Must be a valid license listed at https://spdx.org/licenses/
    - name: release
      type: string?
      doc: If listed should correspond to the release of the workflow in its source reposiory.
